# Mensajes personalizados de errores de conversión (binding).
# Spring los busca de lo más específico a lo más general:
#   typeMismatch.<objeto>.<campo>  ->  typeMismatch.<tipo Java>  ->  typeMismatch
typeMismatch.product.price=El precio debe ser un número válido (use punto decimal, por ejemplo 12.50)
typeMismatch.product.stock=El stock debe ser un número entero válido (por ejemplo 25)
typeMismatch.java.lang.Integer=Debe ingresar un número entero válido
typeMismatch.java.lang.Double=Debe ingresar un número válido
typeMismatch.java.time.LocalDate=Ingrese una fecha válida
