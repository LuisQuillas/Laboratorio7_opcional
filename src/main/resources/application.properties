spring.application.name=laboratorio7

# Puerto: las plataformas cloud suelen inyectar PORT
server.port=${PORT:8080}

# Base de datos lab6 (todo se puede sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab6?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Las tablas ya existen (sql/lab6.sql): JPA no debe crear ni modificar nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Thymeleaf / mensajes
spring.thymeleaf.cache=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Health check para el despliegue (/actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.error.include-message=never
