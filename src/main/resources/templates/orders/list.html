<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos - Portal de gestión comercial</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu('pedidos')}"></div>

<main class="container">
    <div class="toolbar">
        <h1>Pedidos</h1>
        <a class="btn" th:href="@{/orders/new}">Registrar pedido</a>
    </div>

    <div th:replace="~{fragments/menu :: flash}"></div>

    <table>
        <thead>
        <tr>
            <th>N.º</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Documento</th>
            <th class="num">Ítems</th>
            <th class="num">Total (S/)</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inv : ${invoices}">
            <td th:text="${inv.id}">1</td>
            <td><span class="badge" th:text="${inv.type}">Factura</span></td>
            <td th:text="${#temporals.format(inv.date, 'dd/MM/yyyy')}">01/01/2026</td>
            <td th:text="${inv.customer.name}">Cliente</td>
            <td th:text="${inv.customer.documentType + ' ' + inv.customer.document}">DNI 12345678</td>
            <td class="num" th:text="${#lists.size(inv.details)}">1</td>
            <td class="num" th:text="${#numbers.formatDecimal(inv.total, 1, 'COMMA', 2, 'POINT')}">0.00</td>
            <td><a class="btn btn-secondary btn-sm" th:href="@{/orders/{id}(id=${inv.id})}">Ver detalle</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(invoices)}">
            <td colspan="8" class="empty">Aún no hay pedidos registrados.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
