# Levanta MySQL (con la base lab6 ya creada) y la aplicación:
#   docker compose up --build
# Luego abrir http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lab6
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./sql/lab6.sql:/docker-entrypoint-initdb.d/01-lab6.sql:ro
      - ./sql/datos-ejemplo.sql:/docker-entrypoint-initdb.d/02-datos-ejemplo.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/lab6?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  db_data:
